# Copy to local/discovery.toml (git-ignored) and fill in. Never commit the real file:
# the retailer's address and page rules must stay out of the repo (CLAUDE.md rule 7).

# Who to contact about the crawler: an email address or a web page. Required for --live.
contact = "you@example.org"

# Seconds between requests to one host. Never less than 1.
interval_s = 1.0

# Re-fetch cached pages older than this many days; leave out to never re-fetch.
# refresh_days = 90

[retailer]
base_url = "https://retailer.example/"
start_pages = ["/instruments.html", "/varios.html", "/radios.html"]
# Regexes for links to follow from category pages (empty: any same-site .html page).
follow = ['\.html$']
skip = ["basket", "cart", "login", "account", "search", '\?']
max_pages = 2000

# Category page URL (or breadcrumb text) → catalogue category.
[retailer.categories]
"vario" = "vario"
"radio" = "radio"
"transponder" = "transponder"
"flarm" = "flarm"
"instrument" = "instrument"
"switch" = "switch"
"fuse|breaker" = "fuse"

# Optional CSS selectors, if the generic metadata reading misses something.
[retailer.selectors]
# spec = "#product-description"
# price = "meta[itemprop=price]@content"
